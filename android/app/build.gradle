plugins { id 'com.android.application' }

def mobileConfig = new groovy.json.JsonSlurper().parse(rootProject.file('../mobile/config.json'))
def onlineOrigin = (mobileConfig.onlineOrigin ?: '').toString()
if (onlineOrigin) {
    def server = new URI(onlineOrigin)
    if (server.scheme != 'https' || !server.host || server.rawUserInfo || server.rawQuery || server.rawFragment || server.rawPath || (server.port != -1 && server.port != 443)) {
        throw new GradleException('mobile/config.json onlineOrigin must be a bare HTTPS origin on port 443.')
    }
}
def signingPath = System.getenv('PERIMETER_SIGNING_FILE')
def signingProps = new Properties()
if (signingPath) { file(signingPath).withInputStream { signingProps.load(it) } }

android {
    namespace 'ru.moongametechnology.perimeter'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'ru.moongametechnology.perimeter'
        minSdk 26
        targetSdk 36
        versionCode 501
        versionName '0.5.1'
        buildConfigField 'String', 'ONLINE_ORIGIN', groovy.json.JsonOutput.toJson(onlineOrigin)
    }
    signingConfigs {
        if (signingPath) {
            release {
                storeFile new File(file(signingPath).parentFile, signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPath) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'ru.rustore.sdk:review:10.5.1'
    implementation 'ru.rustore.sdk:appupdate:10.5.1'
}

tasks.register('verifyWebAssets') {
    doLast {
        if (!file('src/main/assets/web/index.html').isFile()) throw new GradleException('Run pnpm android:web before building Android.')
        def manifest = file('src/main/assets/web/perimeter-build.json')
        if (!manifest.isFile()) throw new GradleException('Web build metadata is missing. Run pnpm android:web.')
        def built = new groovy.json.JsonSlurper().parse(manifest)
        if (built.onlineOrigin != onlineOrigin || built.privacyPolicyUrl != (mobileConfig.privacyPolicyUrl ?: '')) {
            throw new GradleException('Mobile configuration changed after the web build. Run pnpm android:web again.')
        }
        if (built.versionName != android.defaultConfig.versionName || built.versionCode != android.defaultConfig.versionCode) {
            throw new GradleException('Android version changed after the web build. Run pnpm android:web again.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyWebAssets' }

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!signingPath) throw new GradleException('A signed release requires PERIMETER_SIGNING_FILE. Use assembleDebug for local development.')
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each {
            if (!signingProps[it]) throw new GradleException('The private signing properties are incomplete.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifyReleaseSigning' }
