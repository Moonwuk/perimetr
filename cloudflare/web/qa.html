<!doctype html><html><head><meta charset="utf-8"><title>CONTOUR responsive QA</title><style>body{margin:0;background:#152128;color:#e5f1f5;font:14px Arial}nav{display:flex;gap:10px;padding:10px;position:sticky;top:0;background:#152128;z-index:2}button{padding:8px}iframe{border:0;transform-origin:0 0;display:block}#stage{margin:0 auto;overflow:hidden}</style></head><body><nav><strong>Development fixture</strong><button data-size="1672,944">Desktop 1672×944</button><button data-size="1280,720">Laptop 1280×720</button><button data-size="390,844">Phone 390×844</button><button data-size="320,568">Small phone 320×568</button><button data-size="844,390">Landscape 844×390</button><button id="reset">Reset fixture</button></nav><div id="stage"><iframe title="Game preview" src="/qa-game.html"></iframe></div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('#stage');function size(w,h){let s=Math.min(1,(innerWidth-20)/w,(innerHeight-65)/h);frame.width=w;frame.height=h;frame.style.transform=`scale(${s})`;stage.style.width=w*s+'px';stage.style.height=h*s+'px';}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>size(...b.dataset.size.split(',').map(Number)));document.querySelector('#reset').onclick=()=>frame.src='/qa-game.html';size(1672,944);</script></body></html>
