name: Deploy Perimeter to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perimeter-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PERIMETER_D1_DATABASE_ID: ${{ vars.PERIMETER_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Check configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Add the CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Add the CLOUDFLARE_ACCOUNT_ID variable'; exit 1; }
          test -n "$PERIMETER_D1_DATABASE_ID" || { echo 'Add the PERIMETER_D1_DATABASE_ID variable'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - name: Verify game and Worker
        run: |
          pnpm test
          pnpm exec tsc --noEmit --incremental false
          pnpm cf:check
          pnpm cf:test
      - name: Configure D1 and deploy
        run: |
          pnpm cf:configure
          pnpm cf:deploy
